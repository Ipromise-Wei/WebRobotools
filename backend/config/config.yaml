server:
  app_name: HZAU@AIOT农业AI机器人协同工作平台
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

# Browser access is protected by a signed HttpOnly session. On the first start,
# the backend creates config/auth.local.json and prints the initial password once.
auth:
  enabled: true
  credential_file: config/auth.local.json
  session_hours: 8
  cookie_secure: false
  max_attempts: 5
  lockout_seconds: 300

robot:
  mode: ros2
  state_poll_interval: 0.2

# Keep the Web ROS2 adapter and industrial-PC module runtime in the same domain.
ros2:
  node_name: robot_web_control
  # Commands first pass through the watchdog on the industrial PC.
  cmd_vel_topic: /webrobot/cmd_vel
  odom_topic: /odom
  battery_topic: /battery_state
  map_topic: /map
  plan_topic: /plan
  navigate_to_pose_action: /navigate_to_pose
  navigation_active_topic: /webrobot/navigation/active
  allow_motion_commands: true
  command_timeout: 0.5
  watchdog_status_topic: /webrobot/cmd_vel_watchdog/ready
  watchdog_timeout: 1.0

visualization:
  camera_stream_url: ""
  realsense:
    enabled: true
    source: industrial_pc
    serial: "935523021292"
    video_device: /dev/video4
    input_format: yuyv422
    width: 1280
    height: 720
    fps: 30
    jpeg_quality: 82
    retry_interval_s: 2.0

# RealMan RML63 true-hardware control, aligned with grasp_studio/settings.json.
# The link is opened only by the Web connect button; motion is exposed only
# through typed Web APIs.
arm:
  enabled: true
  transport: industrial_pc
  host: 192.168.1.20
  port: 8080
  network_interface: enp4s0
  timeout_s: 2.0
  allow_motion_commands: true
  expected_tool: Arm_Tip
  collision_level: 8
  joint_speed_percent: 5
  pose_speed_percent: 5
  workspace_min_m: [-1.2, -1.2, 0.05]
  workspace_max_m: [1.2, 1.2, 1.0]
  clearance_m: 0.0
  max_pose_segment_m: 0.8
  keepout_enabled: true
  keepout_min_m: [0.0, 0.0, 0.0]
  keepout_max_m: [0.1, 0.1, 0.1]
  standby_joints_deg: [178.0, 37.258, -65.159, 4.531, -107.568, 6.608]

gripper:
  enabled: true
  allow_commands: true
  open_io: 1
  close_io: 2
  active_level: 0
  pulse_s: 1.0

# Web-managed ROS2 runtime on the industrial PC. Commands are defined here and
# exposed only as start/stop/restart actions; the API cannot execute arbitrary commands.
remote_runtime:
  enabled: true
  host: 192.168.123.41
  user: hzauaiot
  port: 22
  connect_timeout: 5
  agent_path: /home/hzauaiot/.local/lib/webrobot/runtime_agent.py
  domain_id: 30
  # Saved and browser-imported maps are kept on the industrial PC, not in the
  # Web server's temporary filesystem.
  map_directory: /home/hzauaiot/.local/share/webrobot/maps
  environment_setup:
    - /opt/ros/humble/setup.bash
    - /home/hzauaiot/songwei/ChassisControl/install/setup.bash
    - /home/hzauaiot/songwei/Laser/install/setup.bash
    - /home/hzauaiot/songwei/frontier_ws/install/setup.bash
  tasks:
    - id: chassis
      label: Ranger Mini V3 底盘
      command: /home/hzauaiot/.local/lib/webrobot/chassis_runtime.sh
      startup_delay: 3
    - id: lidar
      label: Livox MID-360
      command: ros2 launch livox_ros_driver2 msg_MID360_launch.py
      startup_delay: 5
    - id: localization
      label: FAST-LIO
      command: ros2 launch fast_lio mapping.launch.py config_file:=mid360.yaml rviz:=false
      startup_delay: 8
      dependencies: [lidar]
    - id: laser_scan
      label: 点云转激光
      command: ros2 launch fast_lio cloud_to_scan.launch.py
      startup_delay: 5
      dependencies: [localization]
    - id: slam
      label: SLAM Toolbox
      command: ros2 launch fast_lio slam_mapping.launch.py
      startup_delay: 2
      ready_command: timeout 3 ros2 topic echo /map --once --qos-reliability reliable --qos-durability transient_local
      ready_timeout: 60
      dependencies: [laser_scan]
    - id: navigation
      label: Nav2 导航
      command: /usr/bin/python3 /home/hzauaiot/.local/lib/webrobot/nav2_web_runtime.py --params-file /home/hzauaiot/songwei/Laser/config/nav2_params.yaml
      startup_delay: 5
      dependencies: [chassis, slam]
    - id: frontier_exploration
      label: Frontier 自动建图
      command: ros2 launch frontier_exploration_ros2 frontier_explorer.launch.py params_file:=/home/hzauaiot/songwei/frontier_ws/config/frontier_robot.yaml autostart:=false control_service_enabled:=true map_qos_autodetect_on_startup:=true
      startup_delay: 5
      ready_command: ros2 service list | grep -qx /control_exploration
      ready_timeout: 30
      on_start_command: ros2 run frontier_exploration_ros2 frontier_exploration_ctl start -t 15
      on_stop_command: ros2 run frontier_exploration_ros2 frontier_exploration_ctl stop -t 8 -q
      include_in_start_all: false
      dependencies: [navigation]
  profiles:
    - id: manual_mapping
      label: 手动建图
      tasks: [chassis, lidar, localization, laser_scan, slam, navigation]
    - id: automatic_mapping
      label: 自动建图
      tasks: [chassis, lidar, localization, laser_scan, slam, navigation, frontier_exploration]
