server:
  app_name: HZAU@AIOT农业AI机器人协同工作平台
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

# Browser access is protected by a signed HttpOnly session. On the first start,
# the backend creates config/auth.local.json and prints the initial password once.
auth:
  enabled: true
  credential_file: config/auth.local.json
  session_hours: 8
  cookie_secure: false
  max_attempts: 5
  lockout_seconds: 300

robot:
  mode: ros2
  state_poll_interval: 0.2

# Keep the Web ROS2 adapter and industrial-PC module runtime in the same domain.
ros2:
  node_name: robot_web_control
  # Commands first pass through the watchdog on the industrial PC.
  cmd_vel_topic: /webrobot/cmd_vel
  odom_topic: /odom
  battery_topic: /battery_state
  # The IPC relay consumes raw /map and /plan locally. Only these bounded,
  # best-effort display topics cross the server/industrial-PC DDS network.
  map_topic: /webrobot/web_map
  map_snapshot_interval_s: 0.2
  # Preserve a 512 × 512-equivalent display grid so walls remain legible;
  # this remains a bounded, best-effort display-only payload.
  web_map_max_cells: 262144
  plan_topic: /webrobot/web_plan
  # 频率和点数上限由工控机中继执行；Web 端仅做很短的防御性限流，
  # 避免再次丢弃已中继的最新显示帧。
  path_snapshot_interval_s: 0.1
  web_path_max_points: 256
  # 为控制租约、TF/里程计定时器和地图/路径回调保留独立执行槽。
  executor_threads: 3
  navigate_to_pose_action: /navigate_to_pose
  # Navigation requests/statuses and the request-correlated control lease use
  # small IPC-relay messages; the relay validates its local raw map and talks
  # to Nav2 locally.
  navigation_goal_topic: /webrobot/navigation/goal
  navigation_cancel_topic: /webrobot/navigation/cancel
  navigation_status_topic: /webrobot/navigation/status
  navigation_ready_topic: /webrobot/navigation/ready
  navigation_active_topic: /webrobot/navigation/active
  allow_motion_commands: true
  command_timeout: 0.5
  watchdog_status_topic: /webrobot/cmd_vel_watchdog/ready
  watchdog_timeout: 1.0

visualization:
  camera_stream_url: ""
  realsense:
    enabled: true
    source: industrial_pc
    serial: "935523021292"
    video_device: /dev/video4
    input_format: yuyv422
    width: 1280
    height: 720
    # Low-latency preview: limit video so it cannot fill the same LAN queue
    # used by control/status messages. The stream always keeps the newest frame.
    fps: 12
    jpeg_quality: 70
    max_frame_bytes: 800000
    retry_interval_s: 2.0

# RealMan RML63 true-hardware control, aligned with grasp_studio/settings.json.
# The link is opened only by the Web connect button; motion is exposed only
# through typed Web APIs.
arm:
  enabled: true
  transport: industrial_pc
  host: 192.168.1.20
  port: 8080
  network_interface: enp4s0
  timeout_s: 2.0
  allow_motion_commands: true
  expected_tool: Arm_Tip
  collision_level: 8
  joint_speed_percent: 5
  pose_speed_percent: 5
  workspace_min_m: [-1.2, -1.2, 0.05]
  workspace_max_m: [1.2, 1.2, 1.0]
  clearance_m: 0.0
  max_pose_segment_m: 0.8
  keepout_enabled: true
  keepout_min_m: [0.0, 0.0, 0.0]
  keepout_max_m: [0.1, 0.1, 0.1]
  standby_joints_deg: [178.0, 37.258, -65.159, 4.531, -107.568, 6.608]

gripper:
  enabled: true
  allow_commands: true
  open_io: 1
  close_io: 2
  active_level: 0
  pulse_s: 1.0

# Web-managed ROS2 runtime on the industrial PC. Commands are defined here and
# exposed only as start/stop/restart actions; the API cannot execute arbitrary commands.
remote_runtime:
  enabled: true
  host: 192.168.123.41
  user: hzauaiot
  port: 22
  connect_timeout: 5
  agent_path: /home/hzauaiot/.local/lib/webrobot/runtime_agent.py
  domain_id: 30
  # Saved and browser-imported maps are kept on the industrial PC, not in the
  # Web server's temporary filesystem.
  map_directory: /home/hzauaiot/.local/share/webrobot/maps
  environment_setup:
    - /opt/ros/humble/setup.bash
    - /home/hzauaiot/songwei/ChassisControl/install/setup.bash
    - /home/hzauaiot/songwei/Laser/install/setup.bash
    - /home/hzauaiot/songwei/frontier_ws/install/setup.bash
  tasks:
    - id: chassis
      label: Ranger Mini V3 底盘
      command: /home/hzauaiot/.local/lib/webrobot/chassis_runtime.sh
      startup_delay: 3
    - id: lidar
      label: Livox MID-360
      command: ros2 launch livox_ros_driver2 msg_MID360_launch.py
      startup_delay: 5
    - id: localization
      label: FAST-LIO
      command: ros2 launch fast_lio mapping.launch.py config_file:=mid360.yaml rviz:=false
      startup_delay: 8
      dependencies: [lidar]
    - id: laser_scan
      label: 点云转激光
      command: ros2 launch fast_lio cloud_to_scan.launch.py
      startup_delay: 5
      dependencies: [localization]
    - id: slam
      label: SLAM Toolbox
      command: ros2 launch fast_lio slam_mapping.launch.py
      startup_delay: 2
      ready_command: timeout 3 ros2 topic echo /map --once --qos-reliability reliable --qos-durability transient_local
      ready_timeout: 60
      dependencies: [laser_scan]
    - id: telemetry_relay
      label: 工控机实时通信中继
      command: /usr/bin/python3 /home/hzauaiot/.local/lib/webrobot/telemetry_relay.py --map-topic /map --path-topic /plan --web-map-topic /webrobot/web_map --web-path-topic /webrobot/web_plan --goal-topic /webrobot/navigation/goal --cancel-topic /webrobot/navigation/cancel --status-topic /webrobot/navigation/status --ready-topic /webrobot/navigation/ready --web-active-topic /webrobot/navigation/active --navigate-action /navigate_to_pose --map-interval 0.5 --path-interval 0.5 --max-map-cells 262144 --max-path-points 256 --web-lease-timeout 10
      startup_delay: 1
      dependencies: [chassis, slam]
    - id: navigation
      label: Nav2 导航
      command: /usr/bin/python3 /home/hzauaiot/.local/lib/webrobot/nav2_web_runtime.py --params-file /home/hzauaiot/songwei/Laser/config/nav2_params.yaml
      startup_delay: 5
      dependencies: [chassis, slam, telemetry_relay]
    - id: frontier_exploration
      label: Frontier 自动建图
      command: ros2 launch frontier_exploration_ros2 frontier_explorer.launch.py params_file:=/home/hzauaiot/songwei/frontier_ws/config/frontier_robot.yaml autostart:=false control_service_enabled:=true map_qos_autodetect_on_startup:=true
      startup_delay: 5
      ready_command: ros2 service list | grep -qx /control_exploration
      ready_timeout: 30
      # Use the package's documented control commands.  The runtime agent
      # applies a separate command timeout, so unsupported CLI flags cannot
      # prevent a Frontier stop request from reaching the control service.
      on_start_command: timeout 15 ros2 run frontier_exploration_ros2 frontier_exploration_ctl start
      on_stop_command: timeout 8 ros2 run frontier_exploration_ros2 frontier_exploration_ctl stop
      include_in_start_all: false
      dependencies: [navigation]
  profiles:
    - id: manual_mapping
      label: 手动建图
      tasks: [chassis, lidar, localization, laser_scan, slam, telemetry_relay, navigation]
    - id: automatic_mapping
      label: 自动建图
      tasks: [chassis, lidar, localization, laser_scan, slam, telemetry_relay, navigation, frontier_exploration]
